name: Build Android APK & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Online Server URL for the app (e.g. https://your-domain.vercel.app)'
        required: false
        default: 'https://talk-task.vercel.app'
      release_title:
        description: 'Release Title'
        required: false
        default: 'Gradus Android Release'

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure Capacitor Server URL
        # 仓库的 capacitor.config.ts 直接读 CAPACITOR_SERVER_URL，无需在这里重写配置文件
        run: |
          SERVER_URL="${{ github.event.inputs.server_url || 'https://talk-task.vercel.app' }}"
          echo "Building APK pointing to online server: $SERVER_URL"
          echo "CAPACITOR_SERVER_URL=$SERVER_URL" >> "$GITHUB_ENV"

      - name: Initialize Android platform if needed
        run: |
          if [ ! -d "android" ]; then
            bunx cap add android
          fi
          bun run cap:sync:android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/gradus-android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gradus-android-apk
          path: release-artifacts/gradus-android.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.event.inputs.release_title || github.ref_name }}
          files: release-artifacts/gradus-android.apk
          draft: false
          prerelease: false
          body: |
            ## 📱 拾级（Gradus）移动端安装包发布

            此安装包为 Android 客户端，支持与网页端实时数据联网同步：
            - **无缝数据互通**：登录账号后，与 Web 端任务、排期、成就、AI 规划完全同步
            - **沉浸式体验**：适配全面屏手势、安全区沉浸状态栏与触觉反馈
            - **离线与弱网支持**：搭载 Service Worker 与 PWA 本地缓存加速
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
