<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="gradus-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="step-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="step-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="step-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="spark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="gradus-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="48" height="48" rx="12" fill="url(#gradus-bg)" />

  <g filter="url(#gradus-glow)">
    <!-- Step 1 -->
    <path d="M8 36L18 36L18 30L8 30Z" fill="url(#step-1)" opacity="0.95" />
    <path d="M8 30L14 26L24 26L18 30Z" fill="#A5B4FC" opacity="0.9" />
    <path d="M18 36L24 32L24 26L18 30Z" fill="#4338CA" opacity="0.8" />

    <!-- Step 2 -->
    <path d="M17 30L27 30L27 22L17 22Z" fill="url(#step-2)" />
    <path d="M17 22L23 18L33 18L27 22Z" fill="#7DD3FC" opacity="0.95" />
    <path d="M27 30L33 26L33 18L27 22Z" fill="#0369A1" opacity="0.8" />

    <!-- Step 3 -->
    <path d="M26 22L36 22L36 14L26 14Z" fill="url(#step-3)" />
    <path d="M26 14L32 10L42 10L36 14Z" fill="#6EE7B7" opacity="0.95" />
    <path d="M36 22L42 18L42 10L36 14Z" fill="#047857" opacity="0.8" />

    <!-- Spark -->
    <circle cx="37" cy="9" r="2.5" fill="url(#spark-grad)" />
    <path d="M37 4.5L38 8L41.5 9L38 10L37 13.5L36 10L32.5 9L36 8Z" fill="#FEF08A" opacity="0.95" />
